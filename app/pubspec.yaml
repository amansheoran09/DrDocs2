name: docvault
description: "DocVault by Dr.Docs — store, track and renew all your government documents."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend (Section 5.1)
  supabase_flutter: ^2.5.6

  # Navigation (47 named screens, Section 3)
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Design system (Section 7.1) — Poppins / Inter / Noto Sans Devanagari
  google_fonts: ^6.2.1

  # Misc
  intl: ^0.19.0
  shared_preferences: ^2.3.0 # language + onboarding flags (OB-02)
  percent_indicator: ^4.2.3 # health score ring (HM-01 / AL-03)
  image_picker: ^1.1.2 # document capture (DW-04)
  local_auth: ^2.2.0 # biometric lock (PR-05, Section 10)
  url_launcher: ^6.3.0 # WhatsApp / maps deep links

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
