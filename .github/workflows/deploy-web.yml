name: Deploy web to GitHub Pages

# Builds the React app (web/) and publishes it to GitHub Pages so there is a
# live URL of the running app. Supabase credentials are injected from repo
# secrets at build time; without them the app shows its "config needed" screen
# but still deploys.

on:
  push:
    branches: ["claude/wizardly-edison-vf05eh", "main"]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # base must match the project-pages path: https://<user>.github.io/<repo>/
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build --base=/${{ github.event.repository.name }}/

      # SPA fallback so deep links (e.g. /documents/:id) resolve on Pages.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        # Pages must be enabled once in repo Settings → Pages → Source:
        # "GitHub Actions" (the Actions token cannot create the site itself).
        with:
          enablement: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
